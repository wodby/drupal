name: Build docker image

on:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

env:
  BASE_IMAGE_REVISION: r3
  DRUPAL11: '11.4.7'
  DRUPAL10: '10.6.17'

jobs:
  build-drupal11:
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3' ]
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        env:
          DRUPAL_VER: ${{ env.DRUPAL11 }}
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        working-directory: '11'
        run: |
          make
          make test
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          DRUPAL_VER: ${{ env.DRUPAL11 }}
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        working-directory: '11'
        run: make push

  build-drupal10:
    strategy:
      matrix:
        php: [ '8.4', '8.3', '8.2' ]
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        env:
          DRUPAL_VER: ${{ env.DRUPAL10 }}
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        working-directory: '10'
        run: |
          make
          make test
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          DRUPAL_VER: ${{ env.DRUPAL10 }}
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        working-directory: '10'
        run: make push

  push-drupal11:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build-drupal11
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3' ]
        include:
          - php: '8.5'            
            latest_major_php: '1'
            latest_php: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.DRUPAL11 }}
          php: ${{ matrix.php }}
          latest: 1
          # we only have one version of major drupal.
          latest_major: 1
          latest_php: ${{ matrix.latest_php }}
          latest_major_php: ${{ matrix.latest_major_php }}
          workdir: 11

  push-drupal10:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build-drupal10
    strategy:
      matrix:
        php: [ '8.4', '8.3', '8.2' ]
        include:
          - php: '8.4'
            latest_major_php: '1'
            latest_php: '1'        
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.DRUPAL10 }}
          php: ${{ matrix.php }}
          # we only have one version of major drupal.
          latest_major: 1
          latest_php: ${{ matrix.latest_php }}
          latest_major_php: ${{ matrix.latest_major_php }}
          workdir: 10

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push-drupal11, push-drupal10 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
